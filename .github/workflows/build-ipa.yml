name: Build Kwai IPA

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "GitHub Release 的 tag（里面放了原始 Kwai_14.7.20.ipa）"
        required: true
        default: "kwai-14.7.20"

jobs:
  build:
    # macos-12 自带 Xcode 13，构建系统不含 ScanDependencies，对 2019 年老工程最稳
    runs-on: macos-12
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject VCA_KEY from secrets
        env:
          VCA_KEY: ${{ secrets.VCA_KEY }}
        run: |
          test -n "$VCA_KEY" || { echo "::error::VCA_KEY secret missing"; exit 1; }
          sed -i "s/\"CHANGE_ME\"/\"$VCA_KEY\"/" TLocationPlugin-src/TLocationPlugin/License/LicenseManager.m
          grep -q "$VCA_KEY" TLocationPlugin-src/TLocationPlugin/License/LicenseManager.m && echo "VCA_KEY injected"

      - name: Download original IPA from Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "${{ github.event.inputs.release_tag }}" --pattern '*.ipa' --dir .
          ls -la *.ipa

      - name: Build yololib (Mach-O injector)
        run: |
          cd TLocationPlugin-src/yololib
          clang -fobjc-arc -framework Foundation -o yololib main.m
          file yololib

      - name: Build TLocationPlugin framework
        run: |
          cd TLocationPlugin-src
          xcodebuild -project TLocationPlugin.xcodeproj -scheme TLocationPlugin \
            -configuration Release -sdk iphoneos \
            ONLY_ACTIVE_ARCH=NO CODE_SIGNING_ALLOWED=NO IPHONEOS_DEPLOYMENT_TARGET=12.0 \
            -derivedDataPath ../dd build

      - name: Replace plugin framework (old verify removed) and inject if needed
        run: |
          set -e
          IPA=$(ls *.ipa | head -1)
          echo "using $IPA"
          rm -rf Payload
          unzip -q "$IPA"
          APP=$(ls Payload | head -1)
          BIN=$(/usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "Payload/$APP/Info.plist")
          echo "app dir: $APP, binary: $BIN"
          # 1) 用新编译的 framework 替换旧插件（旧 3DES 验证随之移除，虚拟定位功能保留）
          rm -rf "Payload/$APP/Frameworks/TLocationPlugin.framework"
          mkdir -p "Payload/$APP/Frameworks"
          cp -R dd/Build/Products/Release-iphoneos/TLocationPlugin.framework "Payload/$APP/Frameworks/"
          # 2) 若主二进制尚未加载 TLocationPlugin（原包理论上已加载），用 yololib 补注入
          cd "Payload/$APP"
          plutil -remove UISupportedDevices Info.plist || true
          if ! otool -L "$BIN" | grep -q TLocationPlugin; then
            echo "main binary missing TLocationPlugin load command -> yololib inject"
            ../../TLocationPlugin-src/yololib/yololib "$BIN" "Frameworks/TLocationPlugin.framework/TLocationPlugin"
          else
            echo "main binary already loads TLocationPlugin -> replacement only"
          fi
          cd ../..
          echo "replace/inject done"

      - name: Package IPA
        run: |
          rm -f Kwai_new.ipa
          zip -qr Kwai_new.ipa Payload
          ls -la Kwai_new.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kwai_new_ipa
          path: Kwai_new.ipa

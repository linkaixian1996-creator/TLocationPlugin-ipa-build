workflows:
  build-douyin-ipa:
    name: Build Douyin IPA
    max_build_duration: 40
    instance_type: mac_mini_m2
    environment:
      # Codemagic 支持 16.x~26.x；老工程（2019）用 16.4 最稳
      xcode: 16.4
      vars:
        GH_REPO: linkaixian1996-creator/TLocationPlugin-ipa-build
        RELEASE_TAG: douyin-40.7.0
        IPA_NAME: Douyin_40.7.0.ipa
        APP_DIR: Aweme.app
        APP_BIN: Aweme
        NEW_IPA: Douyin_new.ipa
      groups:
        - vca
    scripts:
      - name: Inject VCA_KEY (观测版可跳过)
        script: |
          if [ -n "${VCA_KEY:-}" ]; then
            sed -i '' "s/\"CHANGE_ME\"/\"$VCA_KEY\"/" TLocationPlugin-src/TLocationPlugin/License/LicenseManager.m
            grep -q "$VCA_KEY" TLocationPlugin-src/TLocationPlugin/License/LicenseManager.m && echo "VCA_KEY injected"
          else
            echo "VCA_KEY 未配置 -> 跳过注入（观测版不需要密钥）"
          fi

      - name: Download Douyin IPA from GitHub Release
        script: |
          curl -L --retry 3 -o "$IPA_NAME" \
            "https://github.com/$GH_REPO/releases/download/$RELEASE_TAG/$IPA_NAME"
          ls -la "$IPA_NAME"

      - name: Build TLocationPlugin.framework (clang + ibtool)
        script: |
          bash build_framework.sh

      - name: Inject framework into Aweme
        script: |
          set -e
          rm -rf Payload
          unzip -q "$IPA_NAME"
          [ -d "Payload/$APP_DIR" ] || { echo "!! Payload/$APP_DIR 不存在，解压结果："; ls Payload; exit 1; }
          mkdir -p "Payload/$APP_DIR/Frameworks"
          rm -rf "Payload/$APP_DIR/Frameworks/TLocationPlugin.framework"
          cp -R /tmp/newfw/TLocationPlugin.framework "Payload/$APP_DIR/Frameworks/"
          plutil -remove UISupportedDevices "Payload/$APP_DIR/Info.plist" || true

          cd "Payload/$APP_DIR"
          if otool -L "$APP_BIN" | grep -q TLocationPlugin; then
            echo "主二进制已加载 TLocationPlugin -> 跳过注入"
          else
            echo "主二进制没有 TLocationPlugin -> yololib 注入"
            clang -fobjc-arc -framework Foundation -o /tmp/yololib ../../TLocationPlugin-src/yololib/main.m
            /tmp/yololib "$APP_BIN" "Frameworks/TLocationPlugin.framework/TLocationPlugin"
          fi
          otool -L "$APP_BIN" | grep -i tlocation || { echo "!! 注入校验失败"; exit 1; }

          codesign -f -s - "$APP_BIN" || true
          codesign -f -s - "Frameworks/TLocationPlugin.framework" || true
          echo "== 注入完成（$APP_BIN） =="
          cd ../..

      - name: Package IPA
        script: |
          rm -f "$NEW_IPA"
          zip -qry "$NEW_IPA" Payload
          ls -la "$NEW_IPA"
          unzip -l "$NEW_IPA" | grep -i tlocation || true

    artifacts:
      - Douyin_new.ipa
